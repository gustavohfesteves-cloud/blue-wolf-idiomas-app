<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body {
            background-color: #0b162c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #112240;
        }

        .progress-fill {
            width: 70%;
            height: 100%;
            background-color: #00d26a;
        }

        .image-container {
            margin-top: 50px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            padding: 5px;
            background-color: #ffffff;
        }

        .image-container img {
            display: block;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }

        .build-area {
            display: flex;
            gap: 10px;
            margin-top: 40px;
            min-height: 50px;
            min-width: 300px;
            border-bottom: 2px solid #1e3a5f;
            padding-bottom: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .options-area {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 600px;
        }

        .word-block {
            background-color: #1e3a5f;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }

        .word-block:active {
            transform: scale(0.95);
        }

        .word-block:hover {
            background-color: #2a4d7a;
        }

        .verify-btn {
            margin-top: auto;
            margin-bottom: 50px;
            background-color: #00d26a;
            color: #ffffff;
            border: none;
            padding: 15px 80px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s;
        }

        .verify-btn:hover {
            background-color: #00b359;
        }
    </style>
</head>
